[project]
name = "nyc-enclave-finder-pipeline"
version = "0.1.0"
description = "Build-time data pipeline for the NYC Enclave Finder"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pyarrow>=15",
    "duckdb>=1.0",
]

[project.optional-dependencies]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "invariants: hard data invariants against the real snapshot (skip if absent)",
    "plausibility: warn-only smoke checks against real data",
]

[tool.ruff]
line-length = 110
target-version = "py311"
