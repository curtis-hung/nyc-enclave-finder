# Diaspora detail from PUMS (SPEC §4.6). PUMS never feeds enclaves, clusters, gaps or the map.
#
# Group definitions: each group is defined in PUMS by the variable matching its default dimension
# (race -> RAC1P/HISP, hispanic -> HISP, asian -> RAC2P19/RAC2P24, ancestry -> ANC1P or ANC2P,
# birthplace -> POBP, language -> LANP). Codes are resolved at build time by matching the ACS
# variable labels of groups.yaml to the PUMS data dictionary labels; the resolved mapping is written
# to docs/PUMS.md and checked against the ACS citywide totals. `match_overrides` fixes labels that
# differ between the two products. Groups with no valid definition get no diaspora detail.

match_overrides:
  # ACS label (normalized, lowercase) -> PUMS dictionary label (normalized, lowercase)
  # values may be one label or a list of labels (their codes are unioned)
  birthplace:
    china, excluding hong kong and taiwan: china
    burma (myanmar): myanmar
    czechoslovakia (includes czech republic and slovakia): [czechoslovakia, czech republic, slovakia]
    north macedonia (macedonia): macedonia
    democratic republic of congo (zaire): democratic republic of the congo
  ancestry:
    trinidadian and tobagonian: trinidadian tobagonian
    assyrian chaldean syriac: [assyrian, chaldean]

