# Cuisine hierarchy (§5.3). A directed acyclic graph rooted at `root`: a node may have several
# parents (e.g. Dominican is below both Latin American and Caribbean; "Chinese/Cuban" is below
# Chinese and Cuban). "Below" (§4.4) means "is a descendant of".
#
# Fields
#   parents  default [root]
#   kind     cuisine (default) | bucket (covers many groups) | food_type (a dish or format that
#            is not a national cuisine) | generic (maps to root: any tag is "below" it)
#   dohmh    exact DOHMH `CUISINE DESCRIPTION` values mapped here. Every value present in the
#            snapshot must be mapped; the build fails otherwise. Blank cuisine maps to root.
#   osm / overture / keywords: external labels mapped here (filled at M6, see §4.4).
#
# Restaurant labels come ONLY from restaurant data (§2.3). Group pairings live in groups.yaml.

nodes:
  - id: root
    name: Any cuisine (unspecified)
    parents: []
    kind: generic
    dohmh: ["Other", "Not Listed/Not Applicable"]

  # --- formats and dishes that say nothing about national cuisine: treated as generic -------
  # They keep their DOHMH text for display, but sit at the root, so an external cuisine label
  # adds specificity instead of conflicting (a bakery tagged "chinese" is not a contradiction).
  - {id: generic_format, name: "Format (bakery, café, juice, …)", kind: generic, parents: [root],
     dohmh: ["Coffee/Tea", "Bakery Products/Desserts", "Juice, Smoothies, Fruit Salads", "Frozen Desserts",
             "Bottled Beverages", "Sandwiches", "Sandwiches/Salads/Mixed Buffet", "Soups/Salads/Sandwiches",
             "Salads", "Soups", "Nuts/Confectionary", "Fruits/Vegetables", "Vegan", "Vegetarian", "Fusion",
             "Chicken", "Seafood", "Donuts", "Continental", "Haute Cuisine"]}

