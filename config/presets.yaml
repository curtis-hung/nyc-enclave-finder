# Analytical presets (§11). Every consequential threshold lives here, nowhere else.
# They are set once for the whole city and never tuned neighbourhood by neighbourhood.
# The point is sensitivity analysis: compare how enclaves, clusters and gaps change.

default_preset: default

presets:
  strict:
    label: Strict
    enclave:
      lq_min: 3.0            # residential LQ cutoff for a qualifying unit
      count_min: 150         # minimum estimated group residents in the unit
      states: [reliable]     # data states allowed to qualify
      min_enclave_pop: 1000  # connected component must hold at least this many group residents
  default:
    label: Default
    enclave:
      lq_min: 2.0
      count_min: 75
      states: [reliable, caution]
      min_enclave_pop: 400
  loose:
    label: Loose
    enclave:
      lq_min: 1.5
      count_min: 40
      states: [reliable, caution]
      min_enclave_pop: 150
