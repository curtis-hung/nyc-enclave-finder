# `generic` labels name a format or dish (coffee, pizza, burger, bar…) and say nothing about a
# national cuisine; they map to the root and never become tags or conflicts.
# Any value not listed maps to the root as well and is logged as unmapped.
# Restaurant labels come only from restaurant data (§2.3).

