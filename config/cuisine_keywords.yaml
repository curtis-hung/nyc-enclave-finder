# Name keywords -> cuisine node (§4.4). Matched as whole words (accent- and case-insensitive)
# against the DOHMH business name only. A keyword alone yields a LOW-confidence tag, which is
# excluded from leaf/intermediate clustering at the default medium+ setting.
# Ambiguous terms map to a parent node rather than a guessed leaf (e.g. "momo" -> Himalayan,
# "arepa" -> South American, since arepas are both Venezuelan and Colombian).

