# Group hierarchy and census crosswalk (§5). Built from the enumerated ACS 2020-2024 variables
# (see data/raw/acs5/*/<table>_variables.json); numbers are the variable line numbers of the
# dimension's table, e.g. `asian: [18]` = B02015_018 (Thai).
#
# dims:
#   <dimension>: [line, ...]            -> exact category (summed if several, summable tables only)
#   <dimension>: {vars: [...], bucket: "..."}
#                                       -> the source category is broader than this group
#                                          (e.g. Thai -> "Other Asian and Pacific Island
#                                          languages"); the UI flags it and roll-ups skip it.
#   A broad group that omits a summable dimension gets it by summing its children's exact
#   categories (§5.4); children lacking that dimension are listed as missing from the sum.
#   Ancestry is never summed (dimensions.yaml): broad groups use a published subtotal or none.
#
# default_dimension drives the initial map, MUST-tier enclaves and gap analysis (§5.2).
# cuisines: cuisine node -> exact | bucket (§5.3). Cuisine node ids are in cuisines.yaml.

groups:
  - id: hispanic
    name: Hispanic & Latin American
    dims:
      race: [12]
      hispanic: [3]
      language: {vars: [3], bucket: "Spanish (includes Spanish speakers of any origin)"}
    default_dimension: hispanic
    cuisines: {latin_american: exact, spanish_hispanic: bucket}
    children:
      - id: mexican
        name: Mexican
        dims: {hispanic: [4], birthplace: [160]}
        default_dimension: hispanic
        cuisines: {mexican: exact, latin_american: bucket}
      - id: puerto_rican
        name: Puerto Rican
        dims: {hispanic: [5]}
        default_dimension: hispanic
        cuisines: {puerto_rican: exact, latin_american: bucket, caribbean: bucket, spanish_hispanic: bucket}
      - id: cuban
        name: Cuban
        dims: {hispanic: [6], birthplace: [143]}
        default_dimension: hispanic
        cuisines: {cuban: exact, latin_american: bucket, caribbean: bucket}
      - id: dominican
        name: Dominican
        dims: {hispanic: [7], birthplace: [145]}
        default_dimension: hispanic
        cuisines: {dominican: exact, latin_american: bucket, caribbean: bucket, spanish_hispanic: bucket}
      - id: central_american
        name: Central American
        dims: {hispanic: [8]}
        default_dimension: hispanic
        cuisines: {central_american: exact, latin_american: bucket}
        children:
          - {id: costa_rican, name: Costa Rican, dims: {hispanic: [9], birthplace: [156]}, default_dimension: hispanic, cuisines: {costa_rican: exact, latin_american: bucket}}
          - {id: guatemalan, name: Guatemalan, dims: {hispanic: [10], birthplace: [158]}, default_dimension: hispanic, cuisines: {guatemalan: exact, latin_american: bucket}}
          - {id: honduran, name: Honduran, dims: {hispanic: [11], birthplace: [159]}, default_dimension: hispanic, cuisines: {honduran: exact, latin_american: bucket}}
          - {id: nicaraguan, name: Nicaraguan, dims: {hispanic: [12], birthplace: [161]}, default_dimension: hispanic, cuisines: {nicaraguan: exact, latin_american: bucket}}
          - {id: panamanian, name: Panamanian, dims: {hispanic: [13], birthplace: [162]}, default_dimension: hispanic, cuisines: {panamanian: exact, latin_american: bucket}}
          - {id: salvadoran, name: Salvadoran, dims: {hispanic: [14], birthplace: [157]}, default_dimension: hispanic, cuisines: {salvadoran: exact, latin_american: bucket}}
      - id: south_american
        name: South American
        dims: {hispanic: [16]}
        default_dimension: hispanic
        cuisines: {south_american: exact, latin_american: bucket}
        children:
          - {id: argentinean, name: Argentinean, dims: {hispanic: [17], birthplace: [165]}, default_dimension: hispanic, cuisines: {argentinian: exact, latin_american: bucket}}
          - {id: bolivian, name: Bolivian, dims: {hispanic: [18], birthplace: [166]}, default_dimension: hispanic, cuisines: {bolivian: exact, latin_american: bucket}}
          - {id: chilean, name: Chilean, dims: {hispanic: [19], birthplace: [168]}, default_dimension: hispanic, cuisines: {chilean: exact, latin_american: bucket}}
          - {id: colombian, name: Colombian, dims: {hispanic: [20], birthplace: [169]}, default_dimension: hispanic, cuisines: {colombian: exact, latin_american: bucket}}
          - {id: ecuadorian, name: Ecuadorian, dims: {hispanic: [21], birthplace: [170]}, default_dimension: hispanic, cuisines: {ecuadorian: exact, latin_american: bucket}}
          - {id: paraguayan, name: Paraguayan, dims: {hispanic: [22]}, default_dimension: hispanic, cuisines: {paraguayan: exact, latin_american: bucket}}
          - {id: peruvian, name: Peruvian, dims: {hispanic: [23], birthplace: [172]}, default_dimension: hispanic, cuisines: {peruvian: exact, latin_american: bucket}}
          - {id: uruguayan, name: Uruguayan, dims: {hispanic: [24], birthplace: [173]}, default_dimension: hispanic, cuisines: {uruguayan: exact, latin_american: bucket}}
          - {id: venezuelan, name: Venezuelan, dims: {hispanic: [25], birthplace: [174]}, default_dimension: hispanic, cuisines: {venezuelan: exact, latin_american: bucket}}
          - id: brazilian
            name: Brazilian
            dims: {ancestry: [22], birthplace: [167]}
            default_dimension: ancestry
            rationale: Brazilians are not classified as Hispanic, so B03001 has no category; ancestry counts U.S.-born and immigrants.
            cuisines: {brazilian: exact, latin_american: bucket}

  - id: asian
    name: Asian
    dims:
      race: [6]
      asian: [1]
    default_dimension: asian
    cuisines: {asian: exact}
    children:
      - id: east_asian
        name: East Asian
        default_dimension: asian
        cuisines: {east_asian: exact, asian: bucket}
        children:
          - id: chinese
            name: Chinese
            dims:
              asian: [2]
              birthplace: [50, 51]
              language: {vars: [21], bucket: "Chinese languages (includes Taiwanese and other Chinese-speaking groups)"}
            default_dimension: asian
            rationale: B02015 "Chinese, except Taiwanese" counts U.S.-born and immigrants; birthplace sums mainland China and Hong Kong.
            cuisines: {chinese: exact, asian: bucket}
          - id: taiwanese
            name: Taiwanese
            dims:
              asian: [8]
              birthplace: [52]
              language: {vars: [21], bucket: "Chinese languages"}
            default_dimension: asian
            cuisines: {taiwanese: exact, chinese: bucket, asian: bucket}
          - id: japanese
            name: Japanese
            dims:
              asian: [4]
              birthplace: [53]
              language: {vars: [30], bucket: "Other Asian and Pacific Island languages"}
            default_dimension: asian
            cuisines: {japanese: exact, asian: bucket}
          - id: korean
            name: Korean
            dims: {asian: [5], birthplace: [54], language: [18]}
            default_dimension: asian
            cuisines: {korean: exact, asian: bucket}
          - {id: mongolian, name: Mongolian, dims: {asian: [6]}, default_dimension: asian, cuisines: {mongolian: exact, asian: bucket}}
      - id: southeast_asian
        name: Southeast Asian
        default_dimension: asian
        cuisines: {southeast_asian: exact, asian: bucket}
        children:
          - {id: burmese, name: Burmese, dims: {asian: [10], birthplace: [69]}, default_dimension: asian, cuisines: {burmese: exact, southeast_asian: bucket}}
          - {id: cambodian, name: Cambodian, dims: {asian: [11], birthplace: [70]}, default_dimension: asian, cuisines: {cambodian: exact, southeast_asian: bucket}}
          - id: filipino
            name: Filipino
            dims: {asian: [12], birthplace: [74], language: {vars: [27], bucket: "Tagalog (incl. Filipino) — a language, not an ethnicity"}}
            default_dimension: asian
            cuisines: {filipino: exact, southeast_asian: bucket}
          - {id: indonesian, name: Indonesian, dims: {asian: [13], birthplace: [71]}, default_dimension: asian, cuisines: {indonesian: exact, southeast_asian: bucket}}
          - {id: laotian, name: Laotian, dims: {asian: [14], birthplace: [72]}, default_dimension: asian, cuisines: {laotian: exact, southeast_asian: bucket}}
          - {id: malaysian, name: Malaysian, dims: {asian: [15], birthplace: [73]}, default_dimension: asian, cuisines: {malaysian: exact, southeast_asian: bucket}}
          - {id: singaporean, name: Singaporean, dims: {asian: [17], birthplace: [75]}, default_dimension: asian, cuisines: {singaporean: exact, southeast_asian: bucket}}
          - id: thai
            name: Thai
            dims: {asian: [18], birthplace: [76], language: {vars: [30], bucket: "Other Asian and Pacific Island languages"}}
            default_dimension: asian
            cuisines: {thai: exact, southeast_asian: bucket}
          - id: vietnamese
            name: Vietnamese
            dims: {asian: [19], birthplace: [77], language: [24]}
            default_dimension: asian
            cuisines: {vietnamese: exact, southeast_asian: bucket}
      - id: south_asian
        name: South Asian
        default_dimension: asian
        cuisines: {south_asian: exact, asian: bucket}
        children:
          - id: indian
            name: Indian
            dims: {asian: [21], birthplace: [60]}
            default_dimension: asian
            cuisines: {indian: exact, south_asian: bucket}
          - {id: bangladeshi, name: Bangladeshi, dims: {asian: [22], birthplace: [58]}, default_dimension: asian, cuisines: {bangladeshi: exact, south_asian: bucket}}
          - {id: bhutanese, name: Bhutanese, dims: {asian: [23], birthplace: [59]}, default_dimension: asian, cuisines: {himalayan: bucket, south_asian: bucket}}
          - {id: nepali, name: Nepali, dims: {asian: [24], birthplace: [63]}, default_dimension: asian, cuisines: {nepali: exact, himalayan: bucket, south_asian: bucket}}
          - {id: pakistani, name: Pakistani, dims: {asian: [25], birthplace: [64]}, default_dimension: asian, cuisines: {pakistani: exact, south_asian: bucket}}
          - {id: sri_lankan, name: Sri Lankan, dims: {asian: [27], birthplace: [65]}, default_dimension: asian, cuisines: {sri_lankan: exact, south_asian: bucket}}
          - id: sikh
            name: Sikh (ACS Asian group)
            dims: {asian: [26]}
            default_dimension: asian
            rationale: The 2020-based ACS codes "Sikh" as a detailed Asian group when respondents write it in. It is shown as reported and is not used to infer religion.
            cuisines: {indian: bucket, south_asian: bucket}
          - id: indo_caribbean
            name: Indo-Caribbean
            dims:
              birthplace: {vars: [151, 171], bucket: "Born in Trinidad & Tobago or Guyana — all ethnic origins; the ACS has no Indo-Caribbean category"}
            default_dimension: birthplace
            rationale: No census table identifies Indo-Caribbean people. The only proxy is birthplace in Guyana or Trinidad & Tobago, which includes every ethnic origin; it is flagged as a bucket.
            cuisines: {indian: bucket, guyanese: bucket, trinidadian: bucket, caribbean: bucket}
      - id: central_asian
        name: Central Asian
        default_dimension: asian
        cuisines: {central_asian: exact, asian: bucket}
        children:
          - id: afghan
            name: Afghan
            dims: {asian: [29], ancestry: [2], birthplace: [57]}
            default_dimension: ancestry
            rationale: Afghan respondents report race as Asian or White inconsistently; ancestry captures self-identified Afghan heritage regardless of race.
            cuisines: {afghan: exact, central_asian: bucket}
          - {id: kazakh, name: Kazakh, dims: {asian: [30], birthplace: [62]}, default_dimension: asian, cuisines: {central_asian: bucket}}
          - {id: uzbek, name: Uzbek, dims: {asian: [31], birthplace: [66]}, default_dimension: asian, cuisines: {uzbek: exact, central_asian: bucket}}

  - id: black
    name: Black (non-Hispanic)
    dims: {race: [4]}
    default_dimension: race
    rationale: Race table; includes African American, Caribbean and African residents who report Black race.
    cuisines: {soul_food: bucket}

  - id: white
    name: White (non-Hispanic)
    dims: {race: [3]}
    default_dimension: race
    cuisines: {}

  - {id: aian, name: American Indian and Alaska Native (non-Hispanic), dims: {race: [5]}, default_dimension: race, cuisines: {}}
  - {id: nhpi, name: Native Hawaiian and Pacific Islander (non-Hispanic), dims: {race: [7]}, default_dimension: race, cuisines: {}}
  - {id: other_race, name: Some other race (non-Hispanic), dims: {race: [8]}, default_dimension: race, cuisines: {}}
  - {id: multiracial, name: Two or more races (non-Hispanic), dims: {race: [9]}, default_dimension: race, cuisines: {}}

  - id: caribbean
    name: Caribbean (West Indian, non-Hispanic)
    dims: {ancestry: [94]}
    default_dimension: ancestry
    rationale: The published "West Indian (except Hispanic groups)" ancestry subtotal counts U.S.-born and immigrants; it excludes Guyanese (a separate ancestry line).
    cuisines: {caribbean: exact}
    children:
      - {id: jamaican, name: Jamaican, dims: {ancestry: [102], birthplace: [148]}, default_dimension: ancestry, cuisines: {jamaican: exact, caribbean: bucket}}
      - id: haitian
        name: Haitian
        dims:
          ancestry: [101]
          birthplace: [147]
          language: {vars: [6], bucket: "French, Haitian, or Cajun"}
        default_dimension: ancestry
        cuisines: {haitian: exact, caribbean: bucket, creole: bucket}
      - {id: trinidadian, name: Trinidadian and Tobagonian, dims: {ancestry: [103], birthplace: [151]}, default_dimension: ancestry, cuisines: {trinidadian: exact, caribbean: bucket}}
      - {id: guyanese, name: Guyanese, dims: {ancestry: [45], birthplace: [171]}, default_dimension: ancestry, cuisines: {guyanese: exact, caribbean: bucket}}
      - {id: barbadian, name: Barbadian, dims: {ancestry: [96], birthplace: [142]}, default_dimension: ancestry, cuisines: {caribbean: bucket}}
      - {id: bahamian, name: Bahamian, dims: {ancestry: [95], birthplace: [141]}, default_dimension: ancestry, cuisines: {caribbean: bucket}}
      - {id: belizean, name: Belizean, dims: {ancestry: [97], birthplace: [155]}, default_dimension: ancestry, cuisines: {caribbean: bucket}}
      - {id: grenadian, name: Grenadian, dims: {birthplace: [146]}, default_dimension: birthplace, rationale: Only available as a country of birth (foreign-born only)., cuisines: {caribbean: bucket}}
      - {id: vincentian, name: Vincentian, dims: {birthplace: [150]}, default_dimension: birthplace, rationale: Only available as a country of birth (foreign-born only)., cuisines: {caribbean: bucket}}
      - {id: st_lucian, name: St. Lucian, dims: {birthplace: [149]}, default_dimension: birthplace, rationale: Only available as a country of birth (foreign-born only)., cuisines: {caribbean: bucket}}
      - {id: dominica, name: Dominica-born (the island of Dominica), dims: {birthplace: [144]}, default_dimension: birthplace, rationale: Only available as a country of birth (foreign-born only)., cuisines: {caribbean: bucket}}

  - id: african
    name: Sub-Saharan African
    dims: {ancestry: [73]}
    default_dimension: ancestry
    rationale: The published "Subsaharan African" ancestry subtotal counts U.S.-born and immigrants.
    cuisines: {african: exact}
    children:
      - id: west_african
        name: West African
        default_dimension: birthplace
        rationale: Ancestry cannot be summed across categories, so the broad group uses summed countries of birth (foreign-born only).
        cuisines: {west_african: exact, african: bucket}
        children:
          - {id: nigerian, name: Nigerian, dims: {ancestry: [79], birthplace: [124]}, default_dimension: ancestry, cuisines: {nigerian: exact, west_african: bucket}}
          - {id: ghanaian, name: Ghanaian, dims: {ancestry: [76], birthplace: [121]}, default_dimension: ancestry, cuisines: {ghanaian: exact, west_african: bucket}}
          - {id: senegalese, name: Senegalese, dims: {ancestry: [80], birthplace: [125]}, default_dimension: ancestry, cuisines: {senegalese: exact, west_african: bucket}}
          - {id: ivorian, name: Ivorian, dims: {birthplace: [122]}, default_dimension: birthplace, rationale: Only available as a country of birth (foreign-born only)., cuisines: {ivorian: exact, west_african: bucket}}
          - {id: liberian, name: Liberian, dims: {ancestry: [78], birthplace: [123]}, default_dimension: ancestry, cuisines: {liberian: exact, west_african: bucket}}
          - {id: sierra_leonean, name: Sierra Leonean, dims: {ancestry: [81], birthplace: [126]}, default_dimension: ancestry, cuisines: {west_african: bucket}}
          - {id: togolese, name: Togolese, dims: {birthplace: [127]}, default_dimension: birthplace, rationale: Only available as a country of birth (foreign-born only)., cuisines: {west_african: bucket}}
          - {id: cape_verdean, name: Cape Verdean, dims: {ancestry: [74], birthplace: [120]}, default_dimension: ancestry, cuisines: {west_african: bucket}}
      - id: east_african
        name: East African
        default_dimension: birthplace
        rationale: Ancestry cannot be summed across categories, so the broad group uses summed countries of birth (foreign-born only).
        cuisines: {east_african: exact, african: bucket}
        children:
          - {id: ethiopian, name: Ethiopian, dims: {ancestry: [75], birthplace: [98]}, default_dimension: ancestry, cuisines: {ethiopian: exact, east_african: bucket}}
          - {id: eritrean, name: Eritrean, dims: {birthplace: [97]}, default_dimension: birthplace, rationale: Only available as a country of birth (foreign-born only)., cuisines: {eritrean: exact, ethiopian: bucket, east_african: bucket}}
          - {id: somali, name: Somali, dims: {ancestry: [82], birthplace: [100]}, default_dimension: ancestry, cuisines: {somali: exact, east_african: bucket}}
          - {id: kenyan, name: Kenyan, dims: {ancestry: [77], birthplace: [99]}, default_dimension: ancestry, cuisines: {east_african: bucket}}
          - {id: ugandan, name: Ugandan, dims: {ancestry: [85], birthplace: [102]}, default_dimension: ancestry, cuisines: {east_african: bucket}}
          - {id: tanzanian, name: Tanzanian, dims: {birthplace: [101]}, default_dimension: birthplace, rationale: Only available as a country of birth (foreign-born only)., cuisines: {east_african: bucket}}
      - {id: sudanese, name: Sudanese, dims: {ancestry: [84], birthplace: [114]}, default_dimension: ancestry, cuisines: {african: bucket}}
      - {id: cameroonian, name: Cameroonian, dims: {birthplace: [106]}, default_dimension: birthplace, rationale: Only available as a country of birth (foreign-born only)., cuisines: {african: bucket}}
      - {id: congolese, name: Congolese (both Congos), dims: {birthplace: [107, 108]}, default_dimension: birthplace, rationale: Only available as a country of birth (foreign-born only); Republic of the Congo and DR Congo are summed., cuisines: {african: bucket}}
      - {id: south_african, name: South African, dims: {ancestry: [83], birthplace: [117]}, default_dimension: ancestry, cuisines: {african: bucket}}
      - {id: zimbabwean, name: Zimbabwean, dims: {ancestry: [86], birthplace: [103]}, default_dimension: ancestry, cuisines: {african: bucket}}

  - id: mena
    name: Middle Eastern & North African
    default_dimension: birthplace
    rationale: No race or ancestry subtotal covers the whole region and ancestry cannot be summed, so the broad group uses summed countries of birth (foreign-born only).
    cuisines: {middle_eastern: exact}
    children:
      - id: arab
        name: Arab
        dims:
          ancestry: [6]
          language: {vars: [33], bucket: "Arabic (spoken by people of many origins)"}
        default_dimension: ancestry
        rationale: The published "Arab" ancestry subtotal counts U.S.-born and immigrants.
        cuisines: {middle_eastern: bucket}
        children:
          - {id: egyptian, name: Egyptian, dims: {ancestry: [7], birthplace: [112]}, default_dimension: ancestry, cuisines: {egyptian: exact, middle_eastern: bucket}}
          - {id: iraqi, name: Iraqi, dims: {ancestry: [8], birthplace: [83]}, default_dimension: ancestry, cuisines: {iraqi: exact, middle_eastern: bucket}}
          - {id: jordanian, name: Jordanian, dims: {ancestry: [9], birthplace: [85]}, default_dimension: ancestry, cuisines: {middle_eastern: bucket}}
          - {id: lebanese, name: Lebanese, dims: {ancestry: [10], birthplace: [87]}, default_dimension: ancestry, cuisines: {lebanese: exact, middle_eastern: bucket}}
          - {id: moroccan, name: Moroccan, dims: {ancestry: [11], birthplace: [113]}, default_dimension: ancestry, cuisines: {moroccan: exact, middle_eastern: bucket}}
          - {id: palestinian, name: Palestinian, dims: {ancestry: [12]}, default_dimension: ancestry, cuisines: {palestinian: exact, middle_eastern: bucket}}
          - {id: syrian, name: Syrian, dims: {ancestry: [13], birthplace: [89]}, default_dimension: ancestry, cuisines: {syrian: exact, middle_eastern: bucket}}
          - id: yemeni
            name: Yemeni
            dims: {birthplace: [92]}
            default_dimension: birthplace
            rationale: Yemeni ancestry has no line of its own in B04006 (it falls under "Other Arab"), so only country of birth is available (foreign-born only).
            cuisines: {yemeni: exact, middle_eastern: bucket}
          - {id: algerian, name: Algerian, dims: {birthplace: [111]}, default_dimension: birthplace, rationale: Only available as a country of birth (foreign-born only)., cuisines: {middle_eastern: bucket}}
      - {id: iranian, name: Iranian, dims: {ancestry: [48], birthplace: [61]}, default_dimension: ancestry, cuisines: {persian: exact, middle_eastern: bucket}}
      - {id: turkish, name: Turkish, dims: {ancestry: [91], birthplace: [90]}, default_dimension: ancestry, cuisines: {turkish: exact, middle_eastern: bucket, mediterranean: bucket}}
      - {id: israeli, name: Israeli, dims: {ancestry: [50], birthplace: [84]}, default_dimension: ancestry, cuisines: {israeli: exact, middle_eastern: bucket}}
      - {id: armenian, name: Armenian, dims: {ancestry: [16], birthplace: [80]}, default_dimension: ancestry, cuisines: {armenian: exact}}
      - {id: assyrian, name: Assyrian/Chaldean/Syriac, dims: {ancestry: [17]}, default_dimension: ancestry, cuisines: {middle_eastern: bucket}}

  - id: european
    name: European
    default_dimension: birthplace
    rationale: Ancestry cannot be summed across categories, so broad European groups use summed countries of birth (foreign-born only). Leaf groups default to ancestry.
    cuisines: {european: exact}
    children:
      - id: southern_european
        name: Southern European
        default_dimension: birthplace
        cuisines: {mediterranean: bucket, european: bucket}
        children:
          - {id: italian, name: Italian, dims: {ancestry: [51], birthplace: [23]}, default_dimension: ancestry, cuisines: {italian: exact, european: bucket}}
          - {id: greek, name: Greek, dims: {ancestry: [44], birthplace: [22]}, default_dimension: ancestry, cuisines: {greek: exact, mediterranean: bucket}}
          - {id: portuguese, name: Portuguese, dims: {ancestry: [62], birthplace: [24]}, default_dimension: ancestry, cuisines: {portuguese: exact, european: bucket}}
          - {id: maltese, name: Maltese, dims: {ancestry: [56]}, default_dimension: ancestry, cuisines: {mediterranean: bucket}}
      - id: eastern_european
        name: Eastern European
        default_dimension: birthplace
        cuisines: {eastern_european: exact, european: bucket}
        children:
          - id: polish
            name: Polish
            dims: {ancestry: [61], birthplace: [40], language: {vars: [12], bucket: "Russian, Polish, or other Slavic languages"}}
            default_dimension: ancestry
            cuisines: {polish: exact, eastern_european: bucket}
          - id: russian
            name: Russian
            dims: {ancestry: [64], birthplace: [42], language: {vars: [12], bucket: "Russian, Polish, or other Slavic languages"}}
            default_dimension: ancestry
            cuisines: {russian: exact, eastern_european: bucket}
          - id: ukrainian
            name: Ukrainian
            dims: {ancestry: [92], birthplace: [44], language: {vars: [12], bucket: "Russian, Polish, or other Slavic languages"}}
            default_dimension: ancestry
            cuisines: {ukrainian: exact, eastern_european: bucket}
          - {id: belarusian, name: Belarusian, dims: {birthplace: [30]}, default_dimension: birthplace, rationale: Only available as a country of birth (foreign-born only)., cuisines: {eastern_european: bucket}}
