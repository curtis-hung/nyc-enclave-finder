# Colloquial places that are not clean NTAs (§4.2). Navigation presets ONLY: each sets a radius
# focus around an approximate center. They are never analytical ground truth, never used to
# define enclaves or clusters, and never used to tune any threshold.
#
# radius_mi must be within the radius slider range (0.1 - 3 mi).
# label: optional short name floated over a restaurant cluster the place overlaps (display only);
#   default is the name without its parenthetical.
# group: the group the place is colloquially associated with (user request at the M5 checkpoint).
#   Choosing a place also selects that group so the map shows it; this is a navigation
#   convenience, not a claim that the area "belongs" to the group or a check of any result.

